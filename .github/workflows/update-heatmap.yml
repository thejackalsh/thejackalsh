name: Update contribution heatmap

"on":
  schedule:
    - cron: "17 6 * * *" # ~13:17 WIB daily
  workflow_dispatch: {}
  push:
    paths: [scripts/heatmap.py, .github/workflows/update-heatmap.yml]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/heatmap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-dark.svg assets/heatmap-light.svg
          git diff --cached --quiet || { git commit -m "chore: refresh contribution heatmap [skip ci]" && git push; }
